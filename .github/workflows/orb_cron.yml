name: ORB Intraday Cron

on:
  schedule:
    - cron: '45-49/5 4 * * 1-5'
    - cron: '*/5 5-8 * * 1-5'
    - cron: '0-45/5 9 * * 1-5'
  workflow_dispatch:

jobs:
  orb-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance gspread google-auth requests

      - name: Run ORB cron
        env: 
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orb_cron.py